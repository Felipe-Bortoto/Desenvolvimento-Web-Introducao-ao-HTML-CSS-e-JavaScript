<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Rotina</title>
    <style>
        body{
            background-color: #99C2FF;
        }
        table{
            width: 50%;
        }

        table,td,th{
            border: 1px solid lightblue;
            border-collapse: collapse;
        }

        td, th{
            padding: 10px;
        }

        tr:hover td, tr hover th {background-color: lightblue;}

        caption{
            margin: 7px;
        }

        
        th {
            background-color: blue;
            color: white;
        }

        td{
            background-color: white;
        }
    </style>
</head>
<body>
    <table border="1">
        <caption>Rotina Semanal</caption>
        <tr>
            <th> </th>
            <th>DOM</th>
            <th>SEG</th>
            <th>TER</th>
            <th>QUA</th>
            <th>QUI</th>
            <th>SEX</th>
            <th>SAB</th>
        </tr>

        <tr>
            <th>Manhã</th>
            <td>dormir</td>
            <td colspan="5">estágio</td>
            <td>dormir</td>
        </tr>

        <tr>
            <th>Tarde</th>
            <td>churrasco</td>
            <td colspan="5">correr</td>
            <td>jogar</td>
        </tr>

        <tr>
            <th>Noite</th>
            <td>jogar</td>
            <td colspan="5">faculdade</td>
            <td>ler</td>
        </tr>
    </table>
</body>
</html>
