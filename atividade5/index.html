<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Formulário</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .input-group label {
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        textarea,
        input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px; 
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            outline: none;
            border-color: #4A6478;
            box-shadow: 0 0 5px rgba(74, 100, 120, 0.3);
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }

        .radio-group label,
        .checkbox-group label {
            font-weight: normal;
            margin-bottom: 0;
            color: #555;
        }

        input[type="file"]::file-selector-button {
            padding: 8px 12px;
            background-color: #4A6478;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-right: 10px;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #385166;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <form action="#" method="POST">
            
            <div class="input-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="input-group">
                <label for="data-nasc">Data de nascimento</label>
                <input type="date" id="data-nasc" name="data-nasc" required>
            </div>

            <div class="input-group">
                <label for="curso">Curso</label>
                <input type="text" id="curso" name="curso" required>
            </div>

            <div class="input-group">
                <label>Sexo</label>
                <div class="radio-group">
                    <input type="radio" id="masculino" name="sexo" value="Masculino">
                    <label for="masculino">Masculino</label>
                    
                    <input type="radio" id="feminino" name="sexo" value="Feminino">
                    <label for="feminino">Feminino</label>
                    
                    <input type="radio" id="outro" name="sexo" value="Outro">
                    <label for="outro">Outro</label>
                </div>
            </div>

            <div class="input-group">
                <label>Interesses</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="frontend" name="interesses" value="Front-end">
                    <label for="frontend">Front-end</label>
                    
                    <input type="checkbox" id="backend" name="interesses" value="Back-end">
                    <label for="backend">Back-end</label>
                    
                    <input type="checkbox" id="design" name="interesses" value="Design">
                    <label for="design">Design</label>
                </div>
            </div>

            <div class="input-group">
                <label for="comentarios">Comentários</label>
                <textarea id="comentarios" name="comentarios" rows="3"></textarea>
            </div>

            <div class="input-group">
                <label for="foto">Upload de foto</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>
            
        </form>
    </div>

</body>
</html>
