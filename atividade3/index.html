<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>le'Beaux</title>
    <!--Trabalho em Dupla
    - Felipe Bortoto dos Santos
    - Nathan Rodrigues Fraile Veiga
    -->
</head>
<body>
    <header>
        <div class = cabecalho>
            <h1>le'Beaux</h1>
            <hr>
        </div>
    </header>

        <div class = grid-container>
            <div class = grid-item>
                <h2>Calça Super Baggy</h2>
                <img src="imagens/Calça.jpg" alt="foto de calça">
                <p>Calça feita com poliester streetwear</p>
            </div>
            <div class = grid-item>
                <h2>Jaqueta de Couro</h2>
                <img src="imagens/jaquetaCouro.webp" alt="foto jaqueta de couro">
                <p>Jaqueta de couro preta, com couro sintético</p>
            </div>
            <div class = grid-item>
                <h2>Jaqueta Faux</h2>
                <img src="imagens/jaquetaFaux.jpg" alt="foto jaqueta faux">
                <p>Jaqueta estilo Faux marrom</p>
            </div>
            <div class = grid-item>
                <h2>Camiseta oversized</h2>
                <img src="imagens/camisetaAlgodao.webp" alt="foto camiseta algodão">
                <p>Camiseta estilo streetwear em oversized, ciano</p>
            </div>
        </div>
        

    <footer>
        <div class="letreiro-container">
            <p class="letreiro-texto">COMPRE AQUI</p>
        </div>
    </footer>
</body>
</html>
